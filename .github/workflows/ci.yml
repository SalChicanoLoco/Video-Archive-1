name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t video-archive-api:ci .
      - name: Start container
        run: |
          cp .env.example .env
          docker run -d --name video-archive-api-ci \
            --env-file .env \
            -p 8000:8000 \
            video-archive-api:ci
      - name: API smoke test
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          bash scripts/smoke.sh
      - name: Container logs (always)
        if: always()
        run: docker logs video-archive-api-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f video-archive-api-ci || true
